name: Autopilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/phase01-extension-inventory]

permissions:
  contents: read

jobs:
  node-test:
    name: Node + SQLite tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, state engine, and regression tests
        run: npm run check
