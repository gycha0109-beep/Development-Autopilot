<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Autopilot</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <div class="popup-wrap">
    <div class="popup-brand">
      <span class="brandmark">A</span>
      <div><strong>Development Autopilot</strong><div class="tiny">Chrome Session Manager</div></div>
    </div>
    <div class="popup-status"><span class="dot"></span> 읽기 전용으로 동작 중</div>
    <div id="popup-stats" class="popup-stats">상태 확인 중…</div>
    <button id="open-dashboard" class="button primary full" type="button">관리 화면 열기 <span aria-hidden="true">↗</span></button>
    <p class="popup-footnote">사용자가 등록한 개발 세션만 관리합니다. 현재 버전에서는 메시지를 전송하지 않습니다.</p>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
